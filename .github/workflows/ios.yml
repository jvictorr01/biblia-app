name: Gerar .ipa (iOS, sem assinatura)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto iOS
        run: npm run ios:add

      - name: Gerar ícones e splash
        run: npm run ios:assets

      - name: Sincronizar app web
        run: npm run ios:sync

      - name: Ajustar Info.plist
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Flux Biblia" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Flux Biblia" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool false" "$PLIST" || true

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FluxBiblia.ipa Payload
          ls -lh FluxBiblia.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FluxBiblia-ipa
          path: FluxBiblia.ipa
          retention-days: 30

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Flux Biblia 1.0.${{ github.run_number }}
          body: "Baixe o FluxBiblia.ipa abaixo e instale pelo Sideloadly com seu Apple ID."
          files: FluxBiblia.ipa
          make_latest: true
